<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#fef9e7"/>
  <rect x="40" y="40" width="520" height="320" rx="12" fill="#fff8ec" stroke="#78350f" stroke-width="5"/>
  <!-- lousa (topo) -->
  <rect x="180" y="55" width="240" height="50" rx="4" fill="#065f46" stroke="#022c22" stroke-width="3"/>
  <text x="300" y="86" text-anchor="middle" font-size="16" fill="#fff" font-family="sans-serif" font-weight="bold">L O U S A</text>
  <!-- mesa do professor -->
  <rect x="240" y="130" width="120" height="40" rx="6" fill="#c084fc" stroke="#6b21a8" stroke-width="3"/>
  <text x="300" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b0764">MESA PROF.</text>
  <!-- carteiras dos alunos: 3 fileiras x 3 -->
  <g stroke="#78350f" stroke-width="2" fill="#fbbf24">
    <rect x="110" y="210" width="60" height="40" rx="4"/>
    <rect x="270" y="210" width="60" height="40" rx="4"/>
    <rect x="430" y="210" width="60" height="40" rx="4"/>
    <rect x="110" y="270" width="60" height="40" rx="4"/>
    <rect x="270" y="270" width="60" height="40" rx="4"/>
    <rect x="430" y="270" width="60" height="40" rx="4"/>
  </g>
  <!-- porta -->
  <rect x="60" y="200" width="14" height="60" fill="#7c4a1a" stroke="#451a03" stroke-width="2"/>
  <text x="50" y="290" font-size="11" font-weight="bold" fill="#451a03">PORTA</text>
  <!-- janelas -->
  <g fill="#bae6fd" stroke="#0369a1" stroke-width="2">
    <rect x="530" y="130" width="20" height="70"/>
    <rect x="530" y="220" width="20" height="70"/>
  </g>
  <text x="562" y="180" font-size="11" font-weight="bold" fill="#0369a1" transform="rotate(90 562 180)">JANELAS</text>
  <!-- porta trás: armário -->
  <rect x="90" y="330" width="120" height="20" fill="#a16207" stroke="#451a03" stroke-width="2"/>
  <text x="150" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ARMÁRIO</text>
</svg>
