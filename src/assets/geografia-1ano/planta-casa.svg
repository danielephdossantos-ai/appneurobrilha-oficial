<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <pattern id="wood" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#f5e6c8"/><path d="M0 9h18" stroke="#e8d3a0" stroke-width="1"/></pattern>
    <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#dbeafe"/><path d="M0 0h20v20H0z" fill="none" stroke="#bfdbfe" stroke-width="1"/></pattern>
    <pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#bbf7d0"/><circle cx="6" cy="6" r="1.5" fill="#86efac"/></pattern>
  </defs>
  <rect width="600" height="400" fill="#fef9e7"/>
  <!-- terreno -->
  <rect x="20" y="20" width="560" height="360" rx="14" fill="url(#grass)"/>
  <!-- casa -->
  <g stroke="#7c4a1a" stroke-width="5" fill="none">
    <rect x="80" y="80" width="440" height="260" fill="#fff8ec"/>
    <!-- divisões: quarto (top-left), banheiro (top-right pequeno), sala (bottom-left grande), cozinha (bottom-right) -->
    <line x1="300" y1="80" x2="300" y2="340"/>
    <line x1="80" y1="200" x2="520" y2="200"/>
    <line x1="420" y1="80" x2="420" y2="200"/>
  </g>
  <!-- pisos -->
  <rect x="82" y="82" width="216" height="116" fill="url(#wood)" opacity="0.6"/>
  <rect x="302" y="82" width="116" height="116" fill="url(#wood)" opacity="0.6"/>
  <rect x="422" y="82" width="96" height="116" fill="url(#tile)"/>
  <rect x="82" y="202" width="216" height="136" fill="url(#wood)" opacity="0.5"/>
  <rect x="302" y="202" width="216" height="136" fill="url(#tile)"/>
  <!-- móveis simplificados -->
  <!-- quarto: cama -->
  <rect x="110" y="110" width="80" height="50" rx="6" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <rect x="110" y="105" width="24" height="18" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <!-- sala: sofá + tv -->
  <rect x="110" y="240" width="120" height="30" rx="8" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
  <rect x="240" y="250" width="30" height="20" fill="#1e293b"/>
  <!-- cozinha: fogão + geladeira -->
  <rect x="330" y="240" width="50" height="40" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="345" cy="255" r="4" fill="#f97316"/><circle cx="365" cy="255" r="4" fill="#f97316"/>
  <rect x="400" y="230" width="34" height="60" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- banheiro: vaso -->
  <ellipse cx="470" cy="140" rx="14" ry="18" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <!-- porta principal -->
  <rect x="285" y="330" width="40" height="14" fill="#7c4a1a"/>
  <!-- telhado -->
  <polygon points="60,90 300,20 540,90" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
</svg>
